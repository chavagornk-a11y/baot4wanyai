<!DOCTYPE html>
<html lang="th" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จุดรวมเรือ บ้านหว้านใหญ่</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef6f9;--card:#fff;--tx:#12303b;--mu:#587480;--ac:#0b6e8a;--bd:#cfe1e8;--hd:#0b4f66}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c22;--card:#17282f;--tx:#e6f1f5;--mu:#93aab3;--ac:#4cc0de;--bd:#2a4450;--hd:#0a2f3d}}
:root[data-theme="dark"]{--bg:#0f1c22;--card:#17282f;--tx:#e6f1f5;--mu:#93aab3;--ac:#4cc0de;--bd:#2a4450;--hd:#0a2f3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Sarabun,"Noto Sans Thai",Tahoma,sans-serif;line-height:1.5}
header{background:var(--hd);color:#fff;text-align:center;padding:22px 14px}
header h1{margin:0;font-size:1.5rem}header p{margin:4px 0 0;opacity:.85}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,button,textarea{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
.bar input{flex:1;min-width:200px;width:auto}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
button.del{background:#c0392b}
.count{color:var(--mu);margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.photos{display:flex;gap:12px;margin-bottom:10px}
.ph{text-align:center;font-size:.8rem;color:var(--mu)}
.ph img,.ph .no{width:1.5in;height:1.5in;object-fit:cover;border-radius:8px;border:1px solid var(--bd);display:block}
.ph .no{display:flex;align-items:center;justify-content:center;background:var(--bg)}
.reg{font-size:1.15rem;font-weight:700;color:var(--ac)}
.row{font-size:.95rem}.row b{color:var(--mu);font-weight:600}
.form{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:18px}
.form h2{margin:0 0 10px;font-size:1.2rem}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
label{display:block;font-size:.9rem;color:var(--mu);margin-bottom:3px}
.prev{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.prev img{max-width:1.5in;max-height:1.5in;border-radius:8px;border:1px solid var(--bd)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.msg{padding:30px;text-align:center;color:var(--mu)}
.hide{display:none}
footer a{color:var(--ac)}
.card[data-id]{cursor:pointer;transition:box-shadow .15s}
.card[data-id]:hover{box-shadow:0 2px 12px rgba(0,0,0,.18)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.hide{display:none}
.mbox{background:var(--card);color:var(--tx);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;padding:18px;position:relative}
.mbox .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.dph{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.dph div{text-align:center;font-size:.85rem;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:6px}
.dph{align-items:flex-start}
.dph img,.dph .no{margin:0 auto}
.dph img{max-width:min(100%,2.6in);max-height:2.6in;width:auto;height:auto;border-radius:10px;border:1px solid var(--bd);display:block}
.dph .no{width:2.6in;max-width:100%;aspect-ratio:1;border-radius:10px;border:1px solid var(--bd)}
.dph .no{display:flex;align-items:center;justify-content:center;background:var(--bg)}
.mbox .row{padding:5px 0;border-bottom:1px solid var(--bd);font-size:1rem}
#list.po{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
#list.po .row,#list.po .acts,#list.po .photos{display:none}
#list.po .card{text-align:center}
.dph img{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#lb.hide{display:none}
#lbimg{max-width:92vw;max-height:78vh;transform-origin:center;cursor:grab;user-select:none;-webkit-user-drag:none;border-radius:6px;touch-action:none}
#lbbar{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;gap:10px;justify-content:center}
#lbbar button{min-width:56px;font-size:1.25rem}
#lbx{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:14px}
#lb .lbs{background:var(--card);color:var(--ac)}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:18px}
@media print{header{background:none;color:#000}.bar,.form,.acts,footer{display:none}.card{break-inside:avoid}}
</style>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var rows=[],art=null,isAdmin=false,editId=null,imgs={owner:null,boat:null};
try{rows=JSON.parse($('boatdata').textContent)||[]}catch(e){rows=[]}

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function sortRows(){rows.sort(function(a,b){return String(a.reg).localeCompare(String(b.reg),'th',{numeric:true})})}

function render(){
  var q=$('q').value.trim().toLowerCase();
  var f=rows.filter(function(r){return !q||[r.reg,r.name,r.type,r.tel,r.addr].join(' ').toLowerCase().indexOf(q)>-1});
  $('cnt').textContent='ทั้งหมด '+rows.length+' รายการ'+(q?' (พบ '+f.length+')':'')+' · กดที่ทะเบียนเพื่อดูรูปและรายละเอียด';
  $('empty').classList.toggle('hide',f.length>0);
  if(!f.length)$('empty').textContent=rows.length?'ไม่พบข้อมูลที่ค้นหา':'ยังไม่มีข้อมูลทะเบียนเรือ';
  $('list').innerHTML=f.map(function(r){
    var o=r.owner?'<img src="'+r.owner+'" alt="เจ้าของเรือ">':'<div class="no">ไม่มีรูป</div>';
    var b=r.boat?'<img src="'+r.boat+'" alt="เรือ">':'<div class="no">ไม่มีรูป</div>';
    return '<div class="card" data-id="'+esc(r.id)+'">'+
    '<div class="reg">ทะเบียน '+esc(r.reg)+'</div>'+
    '<div class="row"><b>ชื่อ-นามสกุล:</b> '+esc(r.name)+'</div>'+
    '<div class="row"><b>ที่อยู่:</b> '+esc(r.addr||'-')+'</div>'+
    '<div class="row"><b>โทรศัพท์:</b> '+esc(r.tel||'-')+'</div>'+
    '<div class="row"><b>ประเภทเรือ:</b> '+esc(r.type||'-')+'</div>'+
    '<div class="row"><b>จำนวนเรือ:</b> '+esc(r.qty||1)+' ลำ</div>'+
    (isAdmin?'<div class="acts"><button class="sec" data-e="'+esc(r.id)+'">แก้ไข</button><button class="del" data-d="'+esc(r.id)+'">ลบ</button></div>':'')+'</div>';
  }).join('');
}

function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var im=new Image();
      im.onerror=rej;
      im.onload=function(){
        var M=480,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');
        c.width=w;c.height=h;
        c.getContext('2d').drawImage(im,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.8));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function pick(inp,key,prev){
  inp.addEventListener('change',function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    shrink(f).then(function(d){imgs[key]=d;prev.src=d;prev.classList.remove('hide')})
    .catch(function(){$('fmsg').textContent='ไม่สามารถอ่านไฟล์รูปภาพได้'});
  });
}
pick($('ownerF'),'owner',$('ownerP'));
pick($('boatF'),'boat',$('boatP'));

function resetForm(){
  editId=null;imgs={owner:null,boat:null};
  ['reg','name','addr','tel','type'].forEach(function(i){$(i).value=''});
  $('qty').value=1;$('ownerF').value='';$('boatF').value='';
  ['ownerP','boatP'].forEach(function(i){$(i).classList.add('hide');$(i).removeAttribute('src')});
  $('fTitle').textContent='ลงทะเบียนเรือใหม่';$('cancel').classList.add('hide');
}
$('cancel').onclick=resetForm;

// build the new document from this page, with fresh data and every dynamic part reset
function buildDoc(){
  var c=document.documentElement.cloneNode(true);
  c.querySelector('#boatdata').textContent=JSON.stringify(rows).replace(/</g,'\\u003c');
  c.querySelector('#list').innerHTML='';
  c.querySelector('#cnt').textContent='';
  var em=c.querySelector('#empty');em.textContent='กำลังโหลดข้อมูล...';em.classList.remove('hide');
  c.querySelector('#adminBox').classList.add('hide');
  c.querySelector('#notice').classList.add('hide');
  c.querySelector('#modal').classList.add('hide');
  c.querySelector('#mbody').innerHTML='';
  c.querySelector('#mtitle').textContent='';
  c.querySelector('#lb').classList.add('hide');
  c.querySelector('#lbimg').removeAttribute('src');
  c.querySelector('#lbimg').removeAttribute('style');
  c.querySelector('#pub').classList.remove('hide');
  c.querySelector('#h1').textContent='จุดรวมเรือ';
  var nl=c.querySelector('#navLink');nl.textContent='สำหรับผู้ดูแลระบบ';nl.setAttribute('href','#admin');
  c.querySelector('#fmsg').textContent='';
  ['ownerP','boatP'].forEach(function(i){var e=c.querySelector('#'+i);e.removeAttribute('src');e.classList.add('hide')});
  c.querySelector('#cancel').classList.add('hide');
  c.querySelector('#fTitle').textContent='ลงทะเบียนเรือใหม่';
  c.querySelectorAll('input').forEach(function(e){e.removeAttribute('value')});
  c.querySelector('#qty').setAttribute('value','1');
  var sv=c.querySelector('#save');sv.removeAttribute('disabled');
  return '<!DOCTYPE html>\n'+c.outerHTML;
}
function publish(okMsg){
  $('save').disabled=true;$('fmsg').textContent='กำลังเผยแพร่...';
  return art.publish(buildDoc()).then(function(){$('fmsg').textContent=okMsg},function(e){
    $('fmsg').textContent=(e&&e.code==='conflict')?'มีผู้ดูแลอื่นแก้ไขพร้อมกัน หน้านี้จะโหลดใหม่ กรุณาทำรายการอีกครั้ง':'เผยแพร่ไม่สำเร็จ ลองใหม่อีกครั้ง';
  }).then(function(){$('save').disabled=false});
}

$('save').onclick=function(){
  if(!art){$('fmsg').textContent='ไม่มีสิทธิ์บันทึกข้อมูล';return}
  var reg=$('reg').value.trim(),name=$('name').value.trim();
  if(!reg||!name){$('fmsg').textContent='กรุณากรอกหมายเลขทะเบียนเรือและชื่อ-นามสกุล';return}
  if(rows.some(function(r){return r.reg===reg&&r.id!==editId})){$('fmsg').textContent='หมายเลขทะเบียนนี้มีอยู่แล้ว';return}
  var rec={id:editId||('b'+Date.now().toString(36)),reg:reg,name:name,addr:$('addr').value.trim(),tel:$('tel').value.trim(),
    type:$('type').value.trim(),qty:parseInt($('qty').value,10)||1,owner:imgs.owner||'',boat:imgs.boat||''};
  var idx=rows.findIndex(function(r){return r.id===rec.id});
  if(idx>-1)rows[idx]=rec;else rows.push(rec);
  sortRows();render();resetForm();
  publish('บันทึกและเผยแพร่เรียบร้อย');
};

$('list').addEventListener('click',function(e){
  var t=e.target;
  if(t.dataset.e){
    var r=rows.filter(function(x){return x.id===t.dataset.e})[0];if(!r)return;
    editId=r.id;
    $('reg').value=r.reg;$('name').value=r.name;$('addr').value=r.addr||'';$('tel').value=r.tel||'';
    $('type').value=r.type||'';$('qty').value=r.qty||1;
    imgs={owner:r.owner||null,boat:r.boat||null};
    [['ownerP',r.owner],['boatP',r.boat]].forEach(function(p){
      if(p[1]){$(p[0]).src=p[1];$(p[0]).classList.remove('hide')}else $(p[0]).classList.add('hide');
    });
    $('fTitle').textContent='แก้ไขข้อมูลทะเบียนเรือ';$('cancel').classList.remove('hide');
    window.scrollTo({top:0,behavior:'smooth'});
  }else if(t.dataset.d){
    if(!confirm('ยืนยันการลบข้อมูลนี้?'))return;
    rows=rows.filter(function(x){return x.id!==t.dataset.d});
    render();publish('ลบและเผยแพร่เรียบร้อย');
  }
});
function openDetail(id){
  var r=rows.filter(function(x){return x.id===id})[0];if(!r)return;
  var o=r.owner?'<img src="'+r.owner+'" alt="เจ้าของเรือ">':'<div class="no">ไม่มีรูป</div>';
  var b=r.boat?'<img src="'+r.boat+'" alt="เรือ">':'<div class="no">ไม่มีรูป</div>';
  $('mtitle').textContent='ทะเบียน '+r.reg;
  $('mbody').innerHTML='<div class="dph"><div>'+o+'เจ้าของเรือ</div><div>'+b+'เรือ</div></div>'+
  '<div class="row"><b>หมายเลขทะเบียนเรือ:</b> '+esc(r.reg)+'</div>'+
  '<div class="row"><b>ชื่อ-นามสกุล:</b> '+esc(r.name)+'</div>'+
  '<div class="row"><b>ที่อยู่:</b> '+esc(r.addr||'-')+'</div>'+
  '<div class="row"><b>เบอร์โทรศัพท์:</b> '+esc(r.tel||'-')+'</div>'+
  '<div class="row"><b>ประเภทเรือ:</b> '+esc(r.type||'-')+'</div>'+
  '<div class="row"><b>จำนวนเรือ:</b> '+esc(r.qty||1)+' ลำ</div>';
  $('modal').classList.remove('hide');
}
function closeDetail(){$('modal').classList.add('hide')}
$('list').addEventListener('click',function(e){
  if(e.target.closest('button'))return;
  var c=e.target.closest('.card');
  if(c&&c.dataset.id)openDetail(c.dataset.id);
});
var z=1,px=0,py=0,pts={},sd=0,sz=1;
function tf(){$('lbimg').style.transform='translate('+px+'px,'+py+'px) scale('+z+')'}
function setZ(n){z=Math.max(1,Math.min(6,n));if(z===1){px=0;py=0}tf()}
function openLb(src){z=1;px=0;py=0;pts={};sd=0;$('lbimg').src=src;tf();$('lb').classList.remove('hide')}
function closeLb(){$('lb').classList.add('hide');$('lbimg').removeAttribute('src')}
function pdist(){var k=Object.keys(pts),a=pts[k[0]],b=pts[k[1]];return Math.hypot(a.x-b.x,a.y-b.y)}
$('mbody').addEventListener('click',function(e){if(e.target.tagName==='IMG')openLb(e.target.src)});
$('lbin').onclick=function(){setZ(z*1.4)};
$('lbout').onclick=function(){setZ(z/1.4)};
$('lbreset').onclick=function(){setZ(1)};
$('lbx').onclick=closeLb;
$('lb').addEventListener('click',function(e){if(e.target===$('lb'))closeLb()});
$('lb').addEventListener('wheel',function(e){e.preventDefault();setZ(z*(e.deltaY<0?1.15:1/1.15))},{passive:false});
$('lbimg').addEventListener('dblclick',function(){setZ(z>1?1:2.5)});
$('lbimg').addEventListener('pointerdown',function(e){
  try{this.setPointerCapture(e.pointerId)}catch(x){}
  pts[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(pts).length===2){sd=pdist();sz=z}
});
$('lbimg').addEventListener('pointermove',function(e){
  var p=pts[e.pointerId];if(!p)return;
  var n=Object.keys(pts).length;
  if(n===2){pts[e.pointerId]={x:e.clientX,y:e.clientY};if(sd)setZ(sz*pdist()/sd)}
  else{if(z>1){px+=e.clientX-p.x;py+=e.clientY-p.y;tf()}pts[e.pointerId]={x:e.clientX,y:e.clientY}}
});
function pend(e){delete pts[e.pointerId];sd=0}
$('lbimg').addEventListener('pointerup',pend);
$('lbimg').addEventListener('pointercancel',pend);
$('mclose').onclick=closeDetail;
$('modal').addEventListener('click',function(e){if(e.target===$('modal'))closeDetail()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('lb').classList.contains('hide'))closeLb();else closeDetail()}});
$('q').addEventListener('input',render);

var canEditUser=false,checked=false;
function apply(){
  var adminView=false;
  isAdmin=adminView&&canEditUser&&!!art;
  $('adminBox').classList.toggle('hide',!isAdmin);
  var blocked=adminView&&!isAdmin;
  $('pub').classList.toggle('hide',blocked);
  var n=$('notice');
  n.classList.toggle('hide',!blocked);
  n.textContent=checked?'หน้านี้สำหรับผู้ดูแลระบบเท่านั้น กรุณาเข้าสู่ระบบ claude.ai ด้วยบัญชีผู้ดูแล แล้วรีเฟรชหน้านี้':'กำลังตรวจสอบสิทธิ์...';
  $('h1').textContent=adminView?'จุดรวมเรือ - หน้าผู้ดูแลระบบ':'จุดรวมเรือ';
  var nl=$('navLink')||document.createElement('a');
  nl.textContent=adminView?'ไปหน้าผู้ชมทั่วไป':'สำหรับผู้ดูแลระบบ';
  nl.setAttribute('href',adminView?'#public':'#admin');
  $('list').classList.toggle('po',!isAdmin);
  $('q').placeholder='ค้นหา: ทะเบียน / ชื่อ / ประเภทเรือ / เบอร์โทร';
  $('q').classList.toggle('hide',!isAdmin);
  render();
}
window.addEventListener('hashchange',apply);
sortRows();apply();
checked=true;apply();
})();
</script>


</body></html>
